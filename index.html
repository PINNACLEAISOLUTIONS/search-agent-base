<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLDTIMECRANK — Antique Phonograph Listings</title>
<meta name="description" content="Live market radar for antique phonographs and Victrolas across Florida Craigslist markets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --ink: #0F172A;
    --ink-2: #334155;
    --muted: #64748B;
    --line: #E2E8F0;
    --accent: #0F766E;
    --accent-dark: #0B5E58;
    --accent-soft: #E6F7F5;
    --header-bg: rgba(15, 23, 42, 0.94);
    --green: #15803D;
    --green-soft: #EAF7EE;
    --amber: #B45309;
    --amber-soft: #FEF4E6;
    --red: #B91C1C;
    --red-soft: #FDECEC;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 4px 16px rgba(15, 23, 42, 0.06);
    --shadow-hover: 0 2px 6px rgba(15, 23, 42, 0.07), 0 14px 34px rgba(15, 23, 42, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Sticky header ─── */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--header-bg);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.14em;
  }

  .brand-mark {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    background: var(--accent);
    flex-shrink: 0;
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .sync-text {
    color: #94A3B8;
    font-size: 0.82rem;
  }

  .sync-text strong {
    color: #E2E8F0;
    font-weight: 600;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.76rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .status-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
  }

  .status-pill.ok { background: var(--green-soft); color: var(--green); }
  .status-pill.partial { background: var(--amber-soft); color: var(--amber); }
  .status-pill.error { background: var(--red-soft); color: var(--red); }
  .status-pill.unknown { background: #F1F5F9; color: var(--muted); }

  /* ─── Layout ─── */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .page-head h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .result-count {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }

  .result-count strong { color: var(--ink-2); font-weight: 600; }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-2);
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .refresh-btn:active { transform: scale(0.98); }

  .refresh-btn .spin { display: inline-block; }
  .refresh-btn.loading .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Alert ─── */
  .alert {
    background: var(--red-soft);
    border: 1px solid #F5C2C2;
    color: var(--red);
    font-size: 0.88rem;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  /* ─── Toolbar ─── */
  .toolbar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 26px;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 14px;
  }

  .field { display: flex; flex-direction: column; min-width: 0; }

  .field label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field input,
  .field select {
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 12px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input:focus,
  .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: #fff;
  }

  /* ─── Grid & cards ─── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }

  .card-img-wrap {
    position: relative;
    aspect-ratio: 16 / 10;
    background: #EDEFF3;
    overflow: hidden;
  }

  .card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .badge-new {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(15, 118, 110, 0.4);
  }

  .card-body {
    padding: 18px 20px 16px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .card-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .source-tag {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .posted-date {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .card-title {
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: -0.005em;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-price {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--accent-dark);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .card-location {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .card-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .view-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent-dark);
    font-size: 0.88rem;
    font-weight: 600;
    text-decoration: none;
    transition: gap 0.15s ease, color 0.15s ease;
  }

  .view-link:hover { color: var(--accent); gap: 10px; }

  /* ─── Empty / loading states ─── */
  .empty, .load-wrap {
    grid-column: 1 / -1;
    text-align: center;
    padding: 72px 20px;
    color: var(--muted);
  }

  .empty-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: #EEF2F7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: #94A3B8;
  }

  .empty h3 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink-2);
    margin-bottom: 6px;
  }

  .empty p { font-size: 0.9rem; }

  .skeleton {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .sk {
    position: relative;
    overflow: hidden;
    background: #EDEFF3;
  }

  .sk::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent);
    animation: shimmer 1.4s infinite;
  }

  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  .sk-img { aspect-ratio: 16 / 10; }
  .sk-body { padding: 18px 20px; }
  .sk-line { height: 12px; border-radius: 6px; margin-bottom: 10px; }
  .sk-line.short { width: 45%; }
  .sk-line.mid { width: 75%; }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    background: var(--surface);
  }

  footer strong { color: var(--ink-2); font-weight: 600; }

  /* ─── Responsive ─── */
  @media (max-width: 900px) {
    .toolbar { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 600px) {
    .container { padding: 24px 16px 48px; }
    .toolbar { grid-template-columns: 1fr; }
    .grid { grid-template-columns: 1fr; }
    .header-inner { padding: 12px 16px; }
    .page-head h1 { font-size: 1.35rem; }
    .sync-text { display: none; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand"><span class="brand-mark"></span>OLDTIMECRANK</div>
    <div class="header-meta">
      <span id="status-pill" class="status-pill unknown"><span class="dot"></span><span id="status-label">Checking…</span></span>
      <span class="sync-text">Last synced <strong id="last-sync">—</strong></span>
    </div>
  </div>
</header>

<main class="container">
  <div class="page-head">
    <div>
      <h1>Market listings</h1>
      <p class="result-count" id="result-count">Loading…</p>
    </div>
    <button class="refresh-btn" id="refresh-btn" type="button">
      <span class="spin">↻</span><span>Refresh</span>
    </button>
  </div>

  <div id="error-alert" class="alert" hidden></div>

  <section class="toolbar" aria-label="Listing filters">
    <div class="field">
      <label for="filter-search">Search</label>
      <input type="search" id="filter-search" placeholder="Search by title…" autocomplete="off">
    </div>
    <div class="field">
      <label for="filter-source">Source</label>
      <select id="filter-source">
        <option value="">All sources</option>
      </select>
    </div>
    <div class="field">
      <label for="filter-keyword">Keyword</label>
      <select id="filter-keyword">
        <option value="">All keywords</option>
      </select>
    </div>
    <div class="field">
      <label for="filter-sort">Sort</label>
      <select id="filter-sort">
        <option value="newest">Newest first</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
      </select>
    </div>
  </section>

  <div id="results" class="grid" aria-live="polite"></div>
</main>

<footer>
  <strong>OLDTIMECRANK</strong> · Antique phonograph market radar · Listings refresh automatically
</footer>

<script>
(function () {
  'use strict';

  var FALLBACK_IMG = 'https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=600&q=80';
  var SEEN_KEY = 'seen_listings';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function parsePrice(item) {
    var n = parseFloat(String(item.price || '').replace(/[^0-9.]/g, ''));
    return isNaN(n) ? null : n;
  }

  function itemDate(item) {
    var raw = item.posted_at || item.first_seen_at || '';
    var t = Date.parse(raw);
    return isNaN(t) ? 0 : t;
  }

  function formatPosted(raw) {
    if (!raw) return '';
    var d = new Date(raw);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function imageFor(item) {
    var url = item.image_url || '';
    if (!url || url.indexOf('transparenttextures') !== -1) return FALLBACK_IMG;
    return url;
  }

  async function tryFetchJson(url) {
    try {
      var res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      return null;
    }
  }

  var App = {
    data: [],
    seenIds: new Set(),

    init: function () {
      this.loadSeen();
      this.bindEvents();
      this.renderLoading();
      this.loadData();
    },

    bindEvents: function () {
      var self = this;
      ['filter-search', 'filter-source', 'filter-keyword', 'filter-sort'].forEach(function (id) {
        document.getElementById(id).addEventListener('input', function () { self.applyFilters(); });
        document.getElementById(id).addEventListener('change', function () { self.applyFilters(); });
      });
      document.getElementById('refresh-btn').addEventListener('click', function () {
        self.renderLoading();
        self.loadData();
      });
      document.getElementById('results').addEventListener('click', function (e) {
        var link = e.target.closest('[data-view-id]');
        if (link) self.markAsSeen(link.getAttribute('data-view-id'));
      });
    },

    loadSeen: function () {
      try {
        var raw = localStorage.getItem(SEEN_KEY);
        if (raw) this.seenIds = new Set(JSON.parse(raw));
      } catch (e) { /* ignore */ }
    },

    saveSeen: function () {
      try {
        localStorage.setItem(SEEN_KEY, JSON.stringify(Array.from(this.seenIds)));
      } catch (e) { /* ignore */ }
    },

    isSeen: function (item) {
      return item.seen === 1 || this.seenIds.has(String(item.listing_id));
    },

    markAsSeen: function (listingId) {
      if (!listingId || this.seenIds.has(String(listingId))) return;
      this.seenIds.add(String(listingId));
      this.saveSeen();
      // Re-render so the NEW badge clears; the link's default navigation still proceeds.
      this.applyFilters();
    },

    renderLoading: function () {
      var btn = document.getElementById('refresh-btn');
      btn.classList.add('loading');
      var grid = document.getElementById('results');
      var html = '';
      for (var i = 0; i < 6; i++) {
        html += '<div class="skeleton"><div class="sk sk-img"></div>' +
          '<div class="sk-body"><div class="sk sk-line mid"></div>' +
          '<div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>';
      }
      grid.innerHTML = html;
      document.getElementById('result-count').textContent = 'Loading…';
    },

    async loadData() {
      // Listings: static file first (Netlify), then API (local dev), then legacy leads.json
      var listings = null;
      var sources = ['./data/listings.json', '/api/listings', './leads.json'];
      for (var i = 0; i < sources.length; i++) {
        var json = await tryFetchJson(sources[i]);
        if (Array.isArray(json) && json.length > 0) { listings = json; break; }
      }
      this.data = listings || [];

      // Status: static file first, then API, then legacy metadata.json
      var status = await tryFetchJson('./data/status.json');
      if (!status) status = await tryFetchJson('/api/status');
      if (!status) {
        var meta = await tryFetchJson('./metadata.json');
        if (meta) {
          status = {
            status: meta.status || 'success',
            run_at: meta.last_updated || meta.run_at,
            error_message: null
          };
        }
      }
      this.updateStatus(status);

      document.getElementById('refresh-btn').classList.remove('loading');
      this.populateDropdowns();
      this.applyFilters();
    },

    updateStatus: function (s) {
      var pill = document.getElementById('status-pill');
      var label = document.getElementById('status-label');
      var syncEl = document.getElementById('last-sync');
      var alert = document.getElementById('error-alert');

      var state = (s && s.status) ? String(s.status).toLowerCase() : 'unknown';
      pill.className = 'status-pill ' + (
        state === 'success' ? 'ok' :
        state === 'partial_success' ? 'partial' :
        state === 'failure' ? 'error' : 'unknown'
      );
      label.textContent =
        state === 'success' ? 'Live' :
        state === 'partial_success' ? 'Partial sync' :
        state === 'failure' ? 'Sync error' : 'Unknown';

      if (state === 'failure' && s && s.error_message) {
        alert.textContent = 'Last sync had an issue: ' + s.error_message;
        alert.hidden = false;
      } else {
        alert.hidden = true;
      }

      var raw = (s && (s.run_at || s.last_updated)) || '';
      if (raw) {
        var iso = raw.indexOf('T') !== -1 ? raw : String(raw).replace(' ', 'T') + 'Z';
        var d = new Date(iso);
        if (!isNaN(d.getTime())) {
          syncEl.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
            ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          syncEl.title = d.toLocaleString();
          return;
        }
        syncEl.textContent = raw;
      } else {
        syncEl.textContent = '—';
      }
    },

    populateDropdowns: function () {
      var srcSel = document.getElementById('filter-source');
      var kwSel = document.getElementById('filter-keyword');
      var curSrc = srcSel.value, curKw = kwSel.value;

      var sources = {}, keywords = {};
      this.data.forEach(function (item) {
        if (item.source) sources[item.source] = true;
        if (item.keyword) keywords[item.keyword] = true;
      });

      srcSel.innerHTML = '<option value="">All sources</option>' +
        Object.keys(sources).sort().map(function (s) {
          return '<option value="' + esc(s) + '"' + (s === curSrc ? ' selected' : '') + '>' + esc(s) + '</option>';
        }).join('');

      kwSel.innerHTML = '<option value="">All keywords</option>' +
        Object.keys(keywords).sort().map(function (k) {
          return '<option value="' + esc(k) + '"' + (k === curKw ? ' selected' : '') + '>' + esc(k) + '</option>';
        }).join('');
    },

    applyFilters: function () {
      var q = document.getElementById('filter-search').value.trim().toLowerCase();
      var src = document.getElementById('filter-source').value;
      var kw = document.getElementById('filter-keyword').value;
      var sort = document.getElementById('filter-sort').value;
      var self = this;

      var filtered = this.data.filter(function (item) {
        if (q) {
          var hay = ((item.title || '') + ' ' + (item.location || '')).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        if (src && item.source !== src) return false;
        if (kw && item.keyword !== kw) return false;
        return true;
      });

      filtered.sort(function (a, b) {
        if (sort === 'price-asc' || sort === 'price-desc') {
          var pa = parsePrice(a), pb = parsePrice(b);
          var va = pa === null ? Infinity : pa;
          var vb = pb === null ? Infinity : pb;
          if (va === vb) return itemDate(b) - itemDate(a);
          return sort === 'price-asc' ? va - vb : vb - va;
        }
        return itemDate(b) - itemDate(a); // newest first
      });

      this.render(filtered);
    },

    render: function (filtered) {
      var grid = document.getElementById('results');
      var total = this.data.length;
      var newCount = this.data.filter(function (item) { return !this.isSeen(item); }, this).length;

      var rc = document.getElementById('result-count');
      if (total === 0) {
        rc.innerHTML = 'No listings yet';
      } else {
        rc.innerHTML = 'Showing <strong>' + filtered.length + '</strong> of <strong>' + total +
          '</strong> listings' + (newCount > 0 ? ' · <strong>' + newCount + '</strong> new' : '');
      }

      if (filtered.length === 0) {
        grid.innerHTML =
          '<div class="empty"><div class="empty-icon">◌</div>' +
          '<h3>No listings found</h3>' +
          '<p>' + (total === 0
            ? 'Listings will appear here once the next sync completes.'
            : 'Try adjusting your search or filters.') + '</p></div>';
        return;
      }

      var self = this;
      grid.innerHTML = filtered.map(function (item) {
        var seen = self.isSeen(item);
        var dateStr = formatPosted(item.posted_at || item.first_seen_at);
        var price = item.price ? esc(item.price) : '<span style="color:var(--muted);font-size:1rem;font-weight:500;">See listing</span>';
        return '' +
        '<article class="card">' +
          '<div class="card-img-wrap">' +
            '<img class="card-img" src="' + esc(imageFor(item)) + '" alt="' + esc(item.title || 'Listing photo') + '" loading="lazy" ' +
              'onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\';">' +
            (seen ? '' : '<span class="badge-new">New</span>') +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-top-row">' +
              '<span class="source-tag">' + esc(item.source || 'Marketplace') + '</span>' +
              (dateStr ? '<span class="posted-date">' + esc(dateStr) + '</span>' : '') +
            '</div>' +
            '<h3 class="card-title">' + esc(item.title || 'Untitled listing') + '</h3>' +
            '<div class="card-price">' + price + '</div>' +
            (item.location ? '<div class="card-location">' + esc(item.location) + '</div>' : '') +
            '<div class="card-footer">' +
              '<a class="view-link" href="' + esc(item.url || '#') + '" target="_blank" rel="noopener" data-view-id="' + esc(item.listing_id) + '">View Listing <span aria-hidden="true">→</span></a>' +
            '</div>' +
          '</div>' +
        '</article>';
      }).join('');
    }
  };

  document.addEventListener('DOMContentLoaded', function () { App.init(); });
})();
</script>
</body>
</html>

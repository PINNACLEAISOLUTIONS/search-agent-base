name: OldTimeCrank Auto Updater (Every 30 Minutes)

on:
  schedule:
    - cron: "*/30 * * * *" # Runs every 30 minutes
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - "sources.json"

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests beautifulsoup4 pandas playwright playwright-stealth
          playwright install chromium --with-deps

      - name: Run Listing Scraper & Exporter
        run: python fetch_listings.py

      - name: Commit and Push Updated Listings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ metadata.json leads.json leads.csv items_for_sale.json
          git commit -m "Auto-update antique listings: $(date -u '+%Y-%m-%d %H:%M:%S UTC') [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main
